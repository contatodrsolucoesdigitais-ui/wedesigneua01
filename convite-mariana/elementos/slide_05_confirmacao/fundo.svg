  <g id="fundo"><rect width="1080" height="1920" fill="#020917"/><rect width="1080" height="1920" fill="url(#blueGlow)"/><circle cx="940" cy="190" r="120" fill="#e9bd78" opacity=".13" filter="url(#softBlur)"/><circle cx="120" cy="1680" r="140" fill="#114d95" opacity=".25" filter="url(#softBlur)"/></g>
