</g></g><line class="goldLine" x1="330" y1="390" x2="475" y2="390"/><path d="M540 377 L553 390 L540 403 L527 390 Z" fill="#efd2a2"/><line class="goldLine" x1="605" y1="390" x2="750" y2="390"/><path class="goldLine" transform="translate(540 1395) scale(0.55)" d="M0 10 C-30 -18 -70 20 0 78 C70 20 30 -18 0 10 Z"/></g><g id="tipografia" text-anchor="middle">
  <text class="serif cream" x="540" y="300" font-size="38">UMA NOVA FASE</text>
  <text class="serif cream" x="540" y="355" font-size="38">COMEÇA...</text>
  <text class="body cream" x="540" y="560" font-size="43">É com muita alegria que</text>
  <text class="body cream" x="540" y="615" font-size="43">chego a este momento tão especial</text>
  <text class="body cream" x="540" y="670" font-size="43">da minha vida!</text>
  <text class="body cream" x="540" y="840" font-size="43">Quero compartilhar com vocês</text>
  <text class="body cream" x="540" y="895" font-size="43">a celebração dos meus 15 anos,</text>
  <text class="body cream" x="540" y="950" font-size="43">que marca o início de um novo ciclo,</text>
  <text class="body cream" x="540" y="1005" font-size="43">com muitos sonhos, planos</text>
  <text class="body cream" x="540" y="1060" font-size="43">e pessoas queridas ao meu lado.</text>
  <text class="script gold" x="540" y="1285" font-size="106">Mariana Borges</text>
</g>

